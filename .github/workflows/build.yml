name: Build MTVisuals

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Mod JAR
        run: gradle build
      - name: Upload MTVisuals JAR
        uses: actions/upload-artifact@v4
        with:
          name: MTVisuals-1.21.4
          path: build/libs/*.jar
